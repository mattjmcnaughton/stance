[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stance"
version = "0.1.0"
description = "Configurable agent sessions and policies, powered by Omnigent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    { name = "mattjmcnaughton", email = "me@mattjmcnaughton.com" },
]
dependencies = [
    "typer>=0.9",
    "structlog>=24.0",
    "pydantic-settings>=2.0",
    "omnigent==0.20.0",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
stance = "stance.cli:app"

[project.urls]
Repository = "https://github.com/mattjmcnaughton/stance"

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external: tests that hit external services",
]
